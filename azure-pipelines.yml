name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
    - master
    - release/*
    - feature/*

pr:
  branches:
    include:
    - develop
    - master
    - release/*
    - feature/*

resources:
  repositories:
    - repository: templates
      type: github
      name: CluedIn-io/AzurePipelines.Templates
      endpoint: 'CluedIn-io'
      ref: refs/heads/refactor

pool:
  vmImage: 'windows-latest'

variables:
  - group: nuget
  - name: testFolderPath
    value: '$(Build.SourcesDirectory)/test'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: buildConfiguration
    value: Release

steps:
  # Install NuGet
  - task: NuGetToolInstaller@1
    displayName: 'Install Nuget'
    inputs:
      checkLatest: true
  
  # Nuget Restore
  - task: NuGetCommand@2
    displayName: 'Restore Nuget packages'
    inputs:
      command: 'restore'
      restoreSolution: '**/*.sln'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'
      configuration: '$(buildConfiguration)'
  
  # DotNet SDK
  - task: DotNetCoreInstaller@0
    inputs:
      version: '2.2.100'
  
  # GitVersion
  - task: GitVersion@4
    inputs:
      preferBundledVersion: true
  
  # Build
  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: '**/*.sln'
      arguments: '--configuration $(buildConfiguration)'
  - task: PowerShell@2
    displayName: 'get version'
    inputs:
      targetType: inline
      script: |
        Push-Location "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn"
        $result = invoke-expression "./csc.exe /langversion:?"
        Write-Host "##vso[task.logissue type=error]$($result)"
        throw $result

  # Configure NuGet
  - task: NuGetAuthenticate@0
    displayName: 'Authenticate with nuget'

  - template: crawler.build.yml@templates
    parameters:
      githubReleaseInMaster: true
      publicReleaseForMaster: true